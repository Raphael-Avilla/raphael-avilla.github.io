# Identidade e configuração do portfólio de Raphael Avilla.
# A aparência do site é definida principalmente em docs/stylesheets/extra.css.
[project]
site_name = "Raphael Avilla | Microsoft Cloud & Security"
site_description = "Portfólio técnico de Raphael Avilla: documentações, laboratórios e projetos sobre Microsoft 365, Entra ID, Intune e segurança."
site_author = "Raphael Avilla"
site_url = "https://raphael-avilla.github.io/"
repo_url = "https://github.com/Raphael-Avilla/raphael-avilla.github.io"
repo_name = "Ver no GitHub"
extra_css = ["stylesheets/extra.css", "stylesheets/artigos.css"]
extra_javascript = ["javascripts/conhecimento.js", "javascripts/projetos.js"]

# O menu lateral inclui somente as cinco paginas principais do portal.
# Artigos, tutoriais, procedimentos e projetos permanecem acessiveis
# por meio dos catalogos, buscas e links internos, sem sobrecarregar o menu.
nav = [
  { "Início" = "index.md" },
  { "Sobre" = "sobre.md" },
  { "Base de Conhecimento" = "conhecimento/index.md" },
  { "Projetos Práticos" = "projetos/index.md" },
  { "Contato" = "contato.md" }
]

# Suprime avisos de paginas propositalmente fora do menu.
# Elas continuam sendo publicadas e indexadas na busca do Zensical.
not_in_nav = """
/conhecimento/entra-id/
/conhecimento/intune/
/conhecimento/defender/
/projetos/
/scripts/
"""

[project.theme]
language = "pt-BR"
features = ["navigation.sections", "navigation.top", "content.code.copy"]

[project.theme.icon]
logo = "lucide/shield-check"
repo = "fontawesome/brands/github"

[project.theme.palette]
scheme = "slate"
primary = "blue"
accent = "cyan"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
