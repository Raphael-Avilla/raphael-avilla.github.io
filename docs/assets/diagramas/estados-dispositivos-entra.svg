<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Três estados de identidade de dispositivos no Microsoft Entra ID</title>
<desc id="diagram-desc">Registro conecta uma identidade de dispositivo para acesso organizacional mantendo o login pessoal; ingresso permite entrada no Windows com a identidade do Microsoft Entra; ingresso híbrido mostra o mesmo dispositivo ligado ao Active Directory local e ao Microsoft Entra ID, com sincronização entre os ambientes.</desc>
<defs>
  <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1b304e"/><stop offset="1" stop-color="#10243c"/></linearGradient>
  <linearGradient id="panel2" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#182b46"/><stop offset="1" stop-color="#101b30"/></linearGradient>
</defs>
<rect width="1400" height="500" rx="24" fill="#0b1425"/>
<g font-family="Arial, Segoe UI, sans-serif">
  <rect x="32" y="29" width="424" height="442" rx="18" fill="url(#panel)" stroke="#2b4e76"/>
  <rect x="488" y="29" width="424" height="442" rx="18" fill="url(#panel2)" stroke="#2b4e76"/>
  <rect x="944" y="29" width="424" height="442" rx="18" fill="url(#panel)" stroke="#2b4e76"/>

  <g fill="#76d7ff" font-size="18" font-weight="700" letter-spacing="1.8">
    <text x="64" y="82">REGISTRO</text>
    <text x="520" y="82">INGRESSO</text>
    <text x="976" y="82">INGRESSO HÍBRIDO</text>
  </g>
  <g font-size="18" fill="#9fb9d6">
    <text x="64" y="115">Conta pessoal ou local no Windows</text>
    <text x="520" y="115">Conta corporativa no Windows</text>
    <text x="976" y="115">Conta do domínio local no Windows</text>
  </g>

  <!-- laptop icons -->
  <g stroke="#8bb9dd" fill="none" stroke-width="4" stroke-linejoin="round">
    <rect x="78" y="160" width="116" height="86" rx="8"/>
    <path d="M65 257h140l-9 15H74z"/>
    <rect x="534" y="160" width="116" height="86" rx="8"/>
    <path d="M521 257h140l-9 15H530z"/>
    <rect x="1088" y="176" width="116" height="86" rx="8"/>
    <path d="M1075 273h140l-9 15H1084z"/>
  </g>
  <g font-weight="700" font-size="20" fill="#dfecfb">
    <text x="104" y="211">PC</text>
    <text x="560" y="211">PC</text>
    <text x="1114" y="227">PC</text>
  </g>

  <!-- simple registration/join connections -->
  <g stroke="#4fbcfb" stroke-width="4" fill="none">
    <path d="M206 207H322" stroke-dasharray="9 10"/>
    <path d="M662 207H778"/>
  </g>
  <g fill="#69ceff">
    <path d="M323 207l-13-8v16z"/>
    <path d="M779 207l-13-8v16z"/>
  </g>
  <g fill="#153e61" stroke="#5ebefd" stroke-width="2">
    <rect x="326" y="157" width="106" height="100" rx="17"/>
    <rect x="782" y="157" width="106" height="100" rx="17"/>
  </g>
  <g fill="#bde7ff" font-size="20" font-weight="800" text-anchor="middle">
    <text x="379" y="204">Entra</text><text x="379" y="228">ID</text>
    <text x="835" y="204">Entra</text><text x="835" y="228">ID</text>
  </g>

  <!-- Hybrid layout -->
  <g fill="#133250" stroke="#4ba1e4" stroke-width="2">
    <rect x="970" y="160" width="96" height="96" rx="17"/>
    <rect x="1242" y="160" width="96" height="96" rx="17"/>
    <rect x="1000" y="320" width="308" height="64" rx="14" fill="#102e43" stroke="#346e95"/>
  </g>
  <g fill="#bde7ff" font-size="18" font-weight="800" text-anchor="middle">
    <text x="1018" y="202">AD</text><text x="1018" y="224">DS</text>
    <text x="1290" y="198">Entra</text><text x="1290" y="222">ID</text>
  </g>
  <text x="1154" y="360" text-anchor="middle" fill="#a3d8f6" font-size="20" font-weight="700">Sincronização de identidades</text>

  <!-- hybrid arrows to PC -->
  <g stroke="#69ceff" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M1068 209h16c18 0 18 10 18 20v0c0 10-8 18-18 18h-14"/>
    <path d="M1238 209h-18c-18 0-18 10-18 20v0c0 10 8 18 18 18h18"/>
    <path d="M1062 305c28 18 63 28 92 28" stroke-dasharray="8 8"/>
    <path d="M1246 305c-28 18-63 28-92 28" stroke-dasharray="8 8"/>
  </g>
  <g fill="#69ceff">
    <path d="M1070 247l-13-8v16z"/>
    <path d="M1238 247l13-8v16z"/>
    <path d="M1157 337l-4-14 14 5z"/>
    <path d="M1151 337l4-14-14 5z"/>
  </g>
  <!-- sync bridge between AD and Entra -->
  <g stroke="#4fbcfb" stroke-width="3" fill="none" stroke-dasharray="7 7">
    <path d="M1066 146c38-28 128-28 176 0"/>
  </g>
  <g fill="#7ad3ff" font-size="14" font-weight="700" text-anchor="middle">
    <text x="1154" y="137">AD Connect / Cloud Sync</text>
  </g>

  <g font-size="18" fill="#a9bfd9" text-anchor="middle">
    <text x="244" y="345">Registro para acesso a</text><text x="244" y="374">recursos da organização</text>
    <text x="700" y="345">Identidade do Entra ID</text><text x="700" y="374">para entrar no sistema</text>
    <text x="1154" y="413">O mesmo dispositivo existe no domínio local</text><text x="1154" y="438">e também no Microsoft Entra ID</text>
  </g>
  <g fill="#658cae" font-size="15" text-anchor="middle">
    <text x="244" y="438">Comum em BYOD</text>
    <text x="700" y="438">Comum em equipamentos corporativos</text>
  </g>
</g>
</svg>
