<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Três estados de identidade de dispositivos no Microsoft Entra ID</title>
<desc id="diagram-desc">Comparação entre registro, ingresso e ingresso híbrido. No modelo híbrido, o mesmo dispositivo está ligado ao Active Directory local e ao Microsoft Entra ID.</desc>
<defs>
  <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
    <stop stop-color="#1b304e"/>
    <stop offset="1" stop-color="#10243c"/>
  </linearGradient>
  <linearGradient id="panel2" x1="0" x2="0" y1="0" y2="1">
    <stop stop-color="#182b46"/>
    <stop offset="1" stop-color="#101b30"/>
  </linearGradient>
</defs>
<rect width="1400" height="500" rx="24" fill="#0b1425"/>
<g font-family="Arial, Segoe UI, sans-serif">
  <rect x="32" y="29" width="424" height="442" rx="18" fill="url(#panel)" stroke="#2b4e76"/>
  <rect x="488" y="29" width="424" height="442" rx="18" fill="url(#panel2)" stroke="#2b4e76"/>
  <rect x="944" y="29" width="424" height="442" rx="18" fill="url(#panel)" stroke="#2b4e76"/>

  <g fill="#76d7ff" font-size="18" font-weight="700" letter-spacing="1.8">
    <text x="64" y="82">REGISTRO</text>
    <text x="520" y="82">INGRESSO</text>
    <text x="976" y="82">INGRESSO HÍBRIDO</text>
  </g>
  <g font-size="18" fill="#9fb9d6">
    <text x="64" y="115">Conta pessoal ou local no Windows</text>
    <text x="520" y="115">Conta corporativa no Windows</text>
    <text x="976" y="115">Conta do domínio local no Windows</text>
  </g>

  <!-- registro -->
  <g stroke="#8bb9dd" fill="none" stroke-width="4" stroke-linejoin="round">
    <rect x="78" y="160" width="116" height="86" rx="8"/>
    <path d="M65 257h140l-9 15H74z"/>
  </g>
  <text x="104" y="211" font-weight="700" font-size="20" fill="#dfecfb">PC</text>
  <path d="M206 207H322" stroke="#4fbcfb" stroke-width="4" fill="none" stroke-dasharray="9 10"/>
  <path d="M323 207l-13-8v16z" fill="#69ceff"/>
  <rect x="326" y="157" width="106" height="100" rx="17" fill="#153e61" stroke="#5ebefd" stroke-width="2"/>
  <g fill="#bde7ff" font-size="20" font-weight="800" text-anchor="middle"><text x="379" y="204">Entra</text><text x="379" y="228">ID</text></g>
  <g font-size="18" fill="#a9bfd9" text-anchor="middle"><text x="244" y="345">Registro para acesso a</text><text x="244" y="374">recursos da organização</text></g>
  <text x="244" y="438" fill="#658cae" font-size="15" text-anchor="middle">Comum em BYOD</text>

  <!-- ingresso -->
  <g stroke="#8bb9dd" fill="none" stroke-width="4" stroke-linejoin="round">
    <rect x="534" y="160" width="116" height="86" rx="8"/>
    <path d="M521 257h140l-9 15H530z"/>
  </g>
  <text x="560" y="211" font-weight="700" font-size="20" fill="#dfecfb">PC</text>
  <path d="M662 207H778" stroke="#4fbcfb" stroke-width="4" fill="none"/>
  <path d="M779 207l-13-8v16z" fill="#69ceff"/>
  <rect x="782" y="157" width="106" height="100" rx="17" fill="#153e61" stroke="#5ebefd" stroke-width="2"/>
  <g fill="#bde7ff" font-size="20" font-weight="800" text-anchor="middle"><text x="835" y="204">Entra</text><text x="835" y="228">ID</text></g>
  <g font-size="18" fill="#a9bfd9" text-anchor="middle"><text x="700" y="345">Identidade do Entra ID</text><text x="700" y="374">para entrar no sistema</text></g>
  <text x="700" y="438" fill="#658cae" font-size="15" text-anchor="middle">Comum em equipamentos corporativos</text>


  <!-- Híbrido: composição aprovada, dimensionada no terceiro painel -->
<svg x="944" y="29" width="424" height="442" viewBox="0 0 344 356" preserveAspectRatio="xMidYMid meet">
<rect x="0.5" y="0.5" width="343" height="355" rx="16" fill="#173254" stroke="#2b4e76"/>
<g font-family="Arial, Segoe UI, sans-serif">
  <text x="24" y="37" fill="#76d7ff" font-size="14" font-weight="700" letter-spacing="1.4">INGRESSO HÍBRIDO</text>
  <text x="24" y="60" fill="#d6e5f4" font-size="13">Conta do domínio local no Windows</text>

  <!-- Microsoft Entra ID: nuvem à esquerda -->
  <path d="M61 174 C44 174 31 163 31 149 C31 137 39 128 51 125
           C50 122 50 119 50 117 C50 104 61 94 74 94
           C81 94 88 97 94 102 C103 89 116 85 129 88
           C143 90 153 100 156 113 C169 115 178 127 178 141
           C178 160 163 174 145 174 H61 Z"
        fill="#12324f" stroke="#6acbfa" stroke-width="2.8" stroke-linejoin="round"/>
  <text x="103" y="139" fill="#e1f1ff" font-size="17" font-weight="700" text-anchor="middle">Entra ID</text>

  <!-- AD DS: domínio local à direita -->
  <path d="M271 101 L312 171 H230 Z" fill="#12324f" stroke="#6acbfa" stroke-width="2.8" stroke-linejoin="round"/>
  <text x="271" y="149" fill="#e1f1ff" font-size="16" font-weight="700" text-anchor="middle">AD DS</text>

  <!-- Linhas de vínculo. Cada uma termina na borda superior do PC. -->
  <path d="M112 169 L112 189 L144 215" stroke="#80d8ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M263 171 L263 190 L199 215" stroke="#80d8ff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pontas das duas setas, encostadas na estrutura do PC. -->
  <path d="M144 215 L133 211 L139 203 Z" fill="#80d8ff"/>
  <path d="M199 215 L207 204 L211 214 Z" fill="#80d8ff"/>

  <!-- Computador -->
  <g stroke="#a4cce8" stroke-width="2.8" fill="#12304a" stroke-linejoin="round">
    <rect x="133" y="217" width="78" height="55" rx="6"/>
    <path d="M125 280 H219 L211 292 H133 Z"/>
  </g>
  <text x="172" y="251" fill="#f0f8ff" font-size="16" font-weight="700" text-anchor="middle">PC</text>

  <text x="172" y="316" fill="#dfefff" font-size="12.8" text-anchor="middle">O mesmo dispositivo tem vínculo com o AD DS</text>
  <text x="172" y="335" fill="#dfefff" font-size="12.8" text-anchor="middle">local e com o Microsoft Entra ID</text>
</g>
</svg>
</g>
</svg>
